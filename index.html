<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Music & Lyrics Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0d0e12;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновый канвас для снега */
    #snow-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Главный контейнер */
    .app-container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Стеклянный стиль Bento */
    .bento-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: border 0.3s ease;
    }

    .bento-card:hover {
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Левая колонка */
    .left-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Аватар / Визуал */
    .visual-card {
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle, rgba(60,60,80,0.5) 0%, rgba(15,15,20,0.8) 100%);
    }

    .visual-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      opacity: 0.8;
    }

    /* Музыкальный плеер */
    .player-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      outline: none;
      font-size: 0.85rem;
    }

    .search-box button {
      background: #ffffff;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .track-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
    }

    .track-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .track-artist {
      font-size: 0.85rem;
      color: #8e8e93;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 5px;
    }

    .control-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .control-btn:hover {
      opacity: 1;
    }

    .play-btn {
      width: 44px;
      height: 44px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
    }

    /* Виджеты снизу слева */
    .widgets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .widget-box {
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 90px;
    }

    .widget-title {
      color: #8e8e93;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .widget-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    /* Эквалайзер */
    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 35px;
    }

    .eq-bar {
      flex: 1;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 2px;
      height: 20%;
      transition: height 0.15s ease;
    }

    /* Правая колонка — караоке текст */
    .lyrics-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      height: 100%;
      min-height: 480px;
      position: relative;
      overflow: hidden;
    }

    .lyrics-header {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 0.75rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
    }

    .lyrics-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .lyric-line {
      font-size: 1.5rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.25);
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .lyric-line.active {
      color: #ffffff;
      font-size: 2rem;
      transform: translateX(10px);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <canvas id="snow-canvas"></canvas>

  <div class="app-container">
    <!-- Левая боковая панель -->
    <div class="left-column">
      <!-- Аватар / Арт -->
      <div class="bento-card visual-card">
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop" alt="Visual Cover">
      </div>

      <!-- Аудио плеер и Поиск -->
      <div class="bento-card player-card">
        <div class="search-box">
          <input type="text" id="track-search" placeholder="Поиск музыки..." value="1000-7">
          <button onclick="searchMusic()">Найти</button>
        </div>

        <div class="track-info">
          <div>
            <div class="track-title" id="song-name">1000-7</div>
            <div class="track-artist" id="song-artist">zxcursed</div>
          </div>
        </div>

        <div class="controls">
          <button class="control-btn">⏮</button>
          <button class="control-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
          <button class="control-btn">⏭</button>
        </div>
      </div>

      <!-- Дополнительные виджеты -->
      <div class="widgets-grid">
        <div class="bento-card widget-box">
          <div class="widget-title">Секундомер</div>
          <div class="widget-value" id="timer">00:00.0</div>
        </div>
        <div class="bento-card widget-box">
          <div class="widget-title">Эквалайзер</div>
          <div class="eq-bars">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Правая панель — Текст песни -->
    <div class="bento-card lyrics-card">
      <div class="lyrics-header">
        <span class="live-dot"></span>
        <span>Текст песни (Live)</span>
      </div>

      <div class="lyrics-container" id="lyrics-list">
        <div class="lyric-line">Клонит спать, но только если под утро</div>
        <div class="lyric-line active">Это мёртвый звук, на колени, сука</div>
        <div class="lyric-line">Я реально мёртвый, это не шутка</div>
        <div class="lyric-line">У меня нет проблем, кроме моей башки</div>
        <div class="lyric-line">1000-7, я умер, прости</div>
        <div class="lyрио-line">Этот дождь нагоняет тоски</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Анимация падающего снега
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const flakes = Array.from({ length: 70 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 3 + 1,
      d: Math.random() * 1 + 0.5
    }));

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      flakes.forEach(f => {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      });
      ctx.fill();
      updateSnow();
    }

    function updateSnow() {
      flakes.forEach(f => {
        f.y += f.d;
        if (f.y > height) {
          f.y = 0;
          f.x = Math.random() * width;
        }
      });
    }

    setInterval(drawSnow, 30);

    // 2. Логика плеера и анимаций
    let isPlaying = false;
    let timerInterval = null;
    let seconds = 0;

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('play-btn').innerText = isPlaying ? '⏸' : '▶';
      
      if (isPlaying) {
        startTimer();
        animateEq();
      } else {
        stopTimer();
      }
    }

    // 3. Секундомер
    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds += 0.1;
        const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
        const ms = Math.floor((seconds % 1) * 10);
        document.getElementById('timer').innerText = `${mins}:${secs}.${ms}`;
      }, 100);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    // 4. Эмуляция работы эквалайзера
    function animateEq() {
      const bars = document.querySelectorAll('.eq-bar');
      if (!isPlaying) {
        bars.forEach(b => b.style.height = '20%');
        return;
      }
      bars.forEach(b => {
        b.style.height = Math.floor(Math.random() * 80 + 20) + '%';
      });
      setTimeout(animateEq, 150);
    }

    // 5. Поиск музыки
    function searchMusic() {
      const query = document.getElementById('track-search').value;
      if (!query) return;

      document.getElementById('song-name').innerText = query;
      document.getElementById('song-artist').innerText = "Исполнитель";
      
      const lyricsContainer = document.getElementById('lyrics-list');
      lyricsContainer.innerHTML = `
        <div class="lyric-line active">Результат поиска для: ${query}</div>
        <div class="lyric-line">Строка текста 1...</div>
        <div class="lyric-line">Строка текста 2...</div>
      `;
    }

    document.getElementById('lyrics-list').addEventListener('click', (e) => {
      if (e.target.classList.contains('lyric-line')) {
        document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
        e.target.classList.add('active');
      }
    });
  </script>
</body>
</html>
