<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Music Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0d0d0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Canvas для анимации снега */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .bento-container {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 420px;
      width: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-full { grid-column: span 2; }

    /* Обложка */
    .cover-card {
      height: 200px;
      overflow: hidden;
      position: relative;
      padding: 0;
    }

    .cover-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      transition: transform 0.5s ease;
    }

    /* Поиск и управление */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-box input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 8px 12px;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    .search-box button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .track-info {
      margin-bottom: 12px;
    }

    .track-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .btn-ctrl {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .btn-ctrl:hover { opacity: 1; }

    .btn-play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Секундомер и эквалайзер */
    .widget-label {
      font-size: 10px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    .timer-val {
      font-size: 22px;
      font-weight: 700;
      margin-top: 6px;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 24px;
      margin-top: 8px;
    }

    .bar {
      flex: 1;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 2px;
      height: 20%;
      transition: height 0.15s ease;
    }

    .playing .bar {
      animation: eq-anim 0.6s infinite alternate ease-in-out;
    }

    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes eq-anim {
      0% { height: 15%; }
      100% { height: 95%; }
    }

    /* Текст песни */
    .lyrics-card {
      height: 160px;
      overflow-y: auto;
    }

    .lyrics-header {
      font-size: 11px;
      color: #22c55e;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
    }

    .lyrics-content {
      font-size: 15px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <canvas id="snow-canvas"></canvas>

  <div class="bento-container">
    <!-- Обложка -->
    <div class="card card-full cover-card">
      <img id="cover-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop" alt="Cover">
    </div>

    <!-- Поиск и Плеер -->
    <div class="card card-full">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Введите песню или артиста...">
        <button id="search-btn">Найти</button>
      </div>

      <div class="track-info">
        <div class="track-title" id="track-title">Поиск музыки...</div>
        <div class="track-artist" id="track-artist">Введите трек выше</div>
      </div>

      <div class="controls">
        <button class="btn-ctrl" id="prev-btn">⏮</button>
        <button class="btn-ctrl btn-play" id="play-btn">▶</button>
        <button class="btn-ctrl" id="next-btn">⏭</button>
      </div>
    </div>

    <!-- Виджет 1: Секундомер трека -->
    <div class="card">
      <div class="widget-label">Время</div>
      <div class="timer-val" id="time-display">00:00</div>
    </div>

    <!-- Виджет 2: Эквалайзер -->
    <div class="card" id="eq-card">
      <div class="widget-label">Эквалайзер</div>
      <div class="eq-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <!-- Текст песни / Караоке -->
    <div class="card card-full lyrics-card">
      <div class="lyrics-header">
        <span class="dot"></span> ТЕКСТ ПЕСНИ (LIVE)
      </div>
      <div class="lyrics-content" id="lyrics-text">Здесь будет отображаться текст песни при воспроизведении...</div>
    </div>
  </div>

  <audio id="audio-player"></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const coverImg = document.getElementById('cover-img');
    const timeDisplay = document.getElementById('time-display');
    const eqCard = document.getElementById('eq-card');
    const lyricsText = document.getElementById('lyrics-text');

    let isPlaying = false;

    // Поиск музыки через открытое Deezer API
    async function searchMusic(query) {
      if (!query.trim()) return;
      trackTitle.textContent = 'Ищем...';
      trackArtist.textContent = '';
      lyricsText.textContent = 'Загрузка текста...';

      try {
        const response = await fetch(`https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp`, {
          mode: 'cors'
        }).catch(() => null);

        // Используем резервный публичный CORS-прокси если прямой запрос ограничен
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://api.deezer.com/search?q=${query}`)}`;
        const res = await fetch(proxyUrl);
        const dataJson = await res.json();
        const data = JSON.parse(dataJson.contents);

        if (data.data && data.data.length > 0) {
          const track = data.data[0];
          playTrack(track);
        } else {
          trackTitle.textContent = 'Ничего не найдено';
          trackArtist.textContent = 'Попробуйте другой запрос';
        }
      } catch (err) {
        trackTitle.textContent = 'Ошибка поиска';
        trackArtist.textContent = 'Проверьте соединение';
      }
    }

    function playTrack(track) {
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist.name;
      coverImg.src = track.album.cover_big || track.album.cover_medium;
      audio.src = track.preview; // 30-секундный предпрослушиваемый аудиопоток

      fetchLyrics(track.artist.name, track.title);

      audio.play();
      isPlaying = true;
      playBtn.textContent = '⏸';
      eqCard.classList.add('playing');
    }

    // Загрузка текста песни из открытого API lyrics.ovh
    async function fetchLyrics(artist, title) {
      try {
        const res = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
        const data = await res.json();
        if (data.lyrics) {
          lyricsText.textContent = data.lyrics;
        } else {
          lyricsText.textContent = `Слова песни "${title}" временно недоступны.\nНаслаждайтесь прослушиванием!`;
        }
      } catch (e) {
        lyricsText.textContent = `Текст песни "${title}" не найден в базе.`;
      }
    }

    // Воспроизведение / Пауза
    playBtn.addEventListener('click', () => {
      if (!audio.src) return;
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶';
        eqCard.classList.remove('playing');
      } else {
        audio.play();
        playBtn.textContent = '⏸';
        eqCard.classList.add('playing');
      }
      isPlaying = !isPlaying;
    });

    searchBtn.addEventListener('click', () => searchMusic(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchMusic(searchInput.value);
    });

    // Обновление секундомера
    audio.addEventListener('timeupdate', () => {
      const cur = Math.floor(audio.currentTime);
      const mins = String(Math.floor(cur / 60)).padStart(2, '0');
      const secs = String(cur % 60).padStart(2, '0');
      timeDisplay.textContent = `${mins}:${secs}`;
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      playBtn.textContent = '▶';
      eqCard.classList.remove('playing');
    });

    // Анимация падающего снега
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const flakes = Array.from({ length: 45 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 3 + 1,
      d: Math.random() * 1 + 0.5
    }));

    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      flakes.forEach(f => {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        f.y += f.d;
        if (f.y > canvas.height) {
          f.y = 0;
          f.x = Math.random() * canvas.width;
        }
      });
      ctx.fill();
      requestAnimationFrame(drawSnow);
    }
    drawSnow();
  </script>
</body>
</html>
